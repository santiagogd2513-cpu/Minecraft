plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.amatista.arsenal'

base {
    archivesName = 'ArsenalOrbital-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    // servidor de prueba: lo usa la compilación de GitHub para revisar el búnker (ver BunkerCiTest)
    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'arsenal.ci', 'true'
            args '--nogui'
            mods {
                arsenalorbital {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : 'arsenalorbital',
                'Specification-Vendor'    : 'santiagogd2513-cpu y Claude',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.version,
                'Implementation-Vendor'   : 'santiagogd2513-cpu y Claude'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
