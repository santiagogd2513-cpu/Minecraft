name: Yunque (antes Forja)

on:
  push:
    branches: [ "**" ]
    paths: [ "forja/**", ".github/workflows/forja.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forja-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar Forja (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forja
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Probar los formatos con las herramientas oficiales de Linux
        run: |
          sudo apt-get install -y dosfstools exfatprogs gdisk e2fsprogs ntfs-3g >/dev/null
          fsck.exfat -V || true
          USAR_LOOP=1 bash test/probar.sh

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Preparar
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Yunque.apk
          # copia con el nombre viejo, para que las versiones instaladas de «Forja» se actualicen solas
          cp ../dist/Yunque.apk ../dist/Forja.apk
          cp NOVEDADES.txt ../dist/novedades.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Yunque-apk
          path: dist/Yunque.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: forja-${{ github.run_number }}
          name: "Yunque #${{ github.run_number }} (formateador de unidades para Android, antes Forja)"
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Yunque** (antes Forja), de Forja Estudios: formatea memorias USB y discos externos desde el celular, sin root y sin anuncios.
            FAT32, exFAT, NTFS y ext4 · tabla MBR o GPT · clúster a elección · de 1 GB a 4 TB.
            Descarga `Yunque.apk`, conecta la unidad por OTG y elige cómo formatearla.

            NTFS se crea con `mkntfs` de [ntfs-3g](https://github.com/tuxera/ntfs-3g) (GPLv2+), compilado dentro de la app.
          files: |
            dist/Yunque.apk
            dist/Forja.apk
            dist/novedades.txt
