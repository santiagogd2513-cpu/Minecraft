name: Navegador Nocturna

on:
  push:
    branches: [ "**" ]
    paths: [ "navegador/**", ".github/workflows/navegador.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: navegador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar Nocturna (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: navegador
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Preparar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Nocturna.apk
          if [ -z "${FIRMA_CLAVE:-}" ]; then echo "::error::Falta el secreto FIRMA_CLAVE (Settings → Secrets and variables → Actions)"; exit 1; fi
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          # firma con la llave nueva y la prueba de que la vieja la autorizó (rotación de llaves, APK Signature Scheme v3)
          "$BT/apksigner" sign --ks app/nocturna.jks --ks-key-alias nocturna --ks-pass pass:nocturna-navegador --key-pass pass:nocturna-navegador \
            --next-signer --ks app/firma-nocturna.p12 --ks-key-alias nocturna --ks-pass env:FIRMA_CLAVE --key-pass env:FIRMA_CLAVE \
            --lineage app/firma-nocturna.linaje --out firmado.apk ../dist/Nocturna.apk
          mv firmado.apk ../dist/Nocturna.apk
          "$BT/apksigner" verify --print-certs ../dist/Nocturna.apk | head -2
          cp NOVEDADES.txt ../dist/novedades.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Nocturna-apk
          path: dist/Nocturna.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: navegador-${{ github.run_number }}
          name: "Nocturna #${{ github.run_number }} (navegador para Android)"
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Nocturna**, el navegador nocturno. Descarga `Nocturna.apk` (con Chrome, no desde otra app) e instálalo.
          files: |
            dist/Nocturna.apk
            dist/novedades.txt
