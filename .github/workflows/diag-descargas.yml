name: Diagnóstico descargas (temporal)
on:
  push:
    paths: [ ".github/diag/**", ".github/workflows/diag-descargas.yml" ]
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Probar
        run: |
          M=$(curl -s -A "nocturna-diag" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.20.1%22%5D" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["files"][0]["url"])')
          S=$(curl -s -A "nocturna-diag" "https://api.modrinth.com/v2/project/sodium/version" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["files"][0]["url"])')
          echo "Modrinth: $M"; echo "Sodium: $S"
          curl -s -A "Mozilla/5.0" "https://www.curseforge.com/api/v1/mods/238222/files?pageIndex=0&pageSize=3" | head -c 1500; echo
          F=$(curl -s -A "Mozilla/5.0" "https://www.curseforge.com/api/v1/mods/238222/files?pageIndex=0&pageSize=3" | python3 -c 'import json,sys;d=json.load(sys.stdin)["data"];print(d[0]["id"])')
          echo "CurseForge archivo: $F"
          curl -s -A "Mozilla/5.0" "https://www.curseforge.com/minecraft/mc-mods/jei/download/$F" | grep -oE '(href|src|url)[=:]"[^"]*(download|forgecdn)[^"]*"' | sort -u | head -20
          java .github/diag/Probe.java "$M" "https://www.curseforge.com/api/v1/mods/238222/files/$F/download"
