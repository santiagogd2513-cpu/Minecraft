name: Diagnóstico descargas (temporal)
on:
  push:
    paths: [ ".github/diag/**", ".github/workflows/diag-descargas.yml" ]
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Probar
        run: |
          M=$(curl -s -A "nocturna-diag" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.20.1%22%5D" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["files"][0]["url"])')
          S=$(curl -s -A "nocturna-diag" "https://api.modrinth.com/v2/project/sodium/version" | python3 -c 'import json,sys;d=json.load(sys.stdin);print(d[0]["files"][0]["url"])')
          echo "Modrinth: $M"; echo "Sodium: $S"
          java .github/diag/Probe.java "$M" "$S" \
            "https://www.curseforge.com/api/v1/mods/238222/files/5272236/download" \
            "https://www.curseforge.com/minecraft/mc-mods/jei/download/5272236" \
            "https://edge.forgecdn.net/files/5272/236/jei-1.20.1-forge-15.3.0.4.jar"
