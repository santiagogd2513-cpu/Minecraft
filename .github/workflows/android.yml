name: Amatista Launcher Android

on:
  push:
    branches: [ "**" ]
    paths: [ "android/**", ".github/workflows/android.yml", ".gitmodules" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK de Android
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Java 8 para Android (Minecraft hasta 1.16 y Forge antiguo).
      - name: Java 8 para Android
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre8
          name: jre8-pojav

      # Java 17, 21 y 25 incluidos dentro del APK: así Forge de cualquier época
      # (1.7.10 → 1.16 con Java 8, 1.17 → 1.20.4 con 17, 1.20.5+ con 21, lo más nuevo con 25)
      # funciona sin descargar Java aparte.
      - name: Java 17 para Android
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre-new
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre17-pojav

      - name: Java 21 para Android
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre-21
          workflow_conclusion: completed
          repo: AngelAuraMC/angelauramc-openjdk-build
          branch: buildjre17-21
          name: jre21-pojav

      - name: Java 25 para Android
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v9
        with:
          workflow: build.yml
          path: android/app_pojavlauncher/src/main/assets/components/jre-25
          workflow_conclusion: completed
          repo: FCL-Team/Android-OpenJDK-Build
          branch: Build_JRE_25
          name: jre25-multiarch

      # Solo se incluye un Java si tiene el formato que espera el launcher; si no, la app lo descarga sola.
      - name: Comprobar los Java incluidos
        run: |
          cd app_pojavlauncher/src/main/assets/components
          notes="$GITHUB_WORKSPACE/dist-notes.md"
          echo "**Android:** descarga \`AmatistaLauncher.apk\`, ábrelo y permite *instalar apps de origen desconocido*." > "$notes"
          echo "" >> "$notes"; echo "Java incluido en el APK:" >> "$notes"
          for d in jre jre-new jre-21 jre-25; do
            case $d in jre) n=8;; jre-new) n=17;; jre-21) n=21;; jre-25) n=25;; esac
            if [ -f "$d/version" ] && [ -f "$d/universal.tar.xz" ] && ls "$d"/bin-*.tar.xz >/dev/null 2>&1; then
              echo "OK  $d ($(cat $d/version)) $(du -sh $d | cut -f1)"; ls "$d"
              echo "- Java $n ✅ ($(du -sh $d | cut -f1))" >> "$notes"
            else
              echo "SIN $d -> se descargará en el celular cuando haga falta"; ls -laR "$d" 2>/dev/null | head -20 || true; rm -rf "$d"
              echo "- Java $n: se descarga en el celular cuando haga falta" >> "$notes"
            fi
          done
          test -d jre || { echo "Falta Java 8"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          gradle-version: "9.6.1"

      - name: Preparar
        run: ./scripts/languagelist_updater.sh

      - name: Compilar APK
        run: gradle :app_pojavlauncher:assembleRelease --stacktrace

      - name: Renombrar
        run: |
          mkdir -p ../dist
          cp app_pojavlauncher/build/outputs/apk/release/app_pojavlauncher-release.apk ../dist/AmatistaLauncher.apk
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: AmatistaLauncher-apk
          path: dist/AmatistaLauncher.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: "Amatista Launcher Android #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: dist-notes.md
          files: dist/AmatistaLauncher.apk
