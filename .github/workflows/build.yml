name: Amatista Launcher

on:
  push:
    branches: [ "**" ]
    # Solo cuando cambia el código del launcher de escritorio: antes salía una versión nueva con cualquier
    # cambio del repositorio (Arca, Bóveda, la página…), aunque el launcher no hubiera cambiado nada.
    # El launcher de Android tiene su propio workflow.
    paths: [ "src-tauri/**", "ui/**", "package.json", "package-lock.json", ".github/workflows/build.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Prueba real: instala Minecraft 1.20.1 vanilla y Forge, y los arranca en una
  # pantalla virtual para comprobar que el juego inicia sin errores.
  live-test:
    name: Prueba real (instalar y arrancar)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev xvfb mesa-utils libgl1-mesa-dri
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Pruebas unitarias
        working-directory: src-tauri
        run: cargo test
      - name: Instalar y arrancar Minecraft (vanilla + Forge)
        working-directory: src-tauri
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo test live_vanilla_and_forge_boot -- --ignored --nocapture

  build:
    name: Compilar (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Dependencias (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Compilar instalador
        shell: bash
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}
      - name: Reunir archivos
        shell: bash
        run: |
          mkdir -p dist
          B=src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp $B/nsis/*.exe "dist/AmatistaLauncher-Setup.exe"
          else
            cp $B/deb/*.deb "dist/AmatistaLauncher.deb"
            cp $B/appimage/*.AppImage "dist/AmatistaLauncher.AppImage"
          fi
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: amatista-${{ matrix.name }}
          path: dist/*

  release:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-${{ github.run_number }}
          name: "Amatista Launcher #${{ github.run_number }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** descarga `AmatistaLauncher-Setup.exe` y ejecútalo. Si aparece "Windows protegió su PC", pulsa **Más información → Ejecutar de todas formas**.

            **Linux:** `AmatistaLauncher.AppImage` (dale permiso de ejecución) o `AmatistaLauncher.deb`.
          files: dist/*
