name: Ventoy no oficial

on:
  push:
    branches: [ "**" ]
    paths: [ "ventoy/**", "forja/app/src/main/**", "forja/test/motor_ntfs_pc.sh", ".github/workflows/ventoy.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ventoy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar Ventoy no oficial (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ventoy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bajar Ventoy oficial (última versión)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/ventoy/Ventoy/releases/latest --jq .tag_name)
          VER=${TAG#v}
          echo "Ventoy $VER"
          echo "VENTOY_VER=$VER" >> "$GITHUB_ENV"
          gh api repos/ventoy/Ventoy/releases/latest --jq '.assets[].name'
          URL=$(gh api repos/ventoy/Ventoy/releases/latest --jq '[.assets[] | select(.name | test("linux\\.tar\\.gz$"))][0].browser_download_url')
          echo "Bajando $URL"
          curl -fsSL -o /tmp/ventoy.tgz "$URL"
          mkdir -p /tmp/vt && tar xzf /tmp/ventoy.tgz -C /tmp/vt
          SRC=$(dirname "$(find /tmp/vt -path '*/boot/boot.img' | head -1)")/..
          ls "$SRC"
          A=app/src/main/assets/ventoy
          mkdir -p $A
          cp $SRC/boot/boot.img $A/boot.img
          xz -dc $SRC/boot/core.img.xz > $A/core.img
          xz -dc $SRC/ventoy/ventoy.disk.img.xz > $A/ventoy.disk.img
          cp $SRC/ventoy/version $A/version
          ls -la $A
          test "$(stat -c %s $A/core.img)" = "1048064"
          test "$(stat -c %s $A/ventoy.disk.img)" = "33554432"

      - name: Probar la instalación en una USB de mentira
        run: |
          set -euo pipefail
          sudo apt-get install -y exfatprogs dosfstools e2fsprogs ntfs-3g >/dev/null
          mkdir -p /tmp/t/out
          F=../forja/app/src/main/java/com/forja/formateador
          javac -d /tmp/t/out app/src/main/java/com/ventoy/nooficial/{BlockDevice,Progress,Disk,ExFatFormatter,Fat16,VentoyInstaller}.java \
            $(ls $F/*.java | grep -v -e MainActivity -e UsbDisk -e Ui.java -e Updater.java -e Studio.java) test/*.java
          bash ../forja/test/motor_ntfs_pc.sh /tmp/t/nb
          for CASO in "1024 EXFAT" "40960 EXFAT" "2048 NTFS" "2048 FAT32" "2048 EXT4" "40960 NTFS"; do
            set -- $CASO
            rm -f /tmp/t/usb.img
            java -Djava.library.path=/tmp/t/nb -cp /tmp/t/out Test app/src/main/assets/ventoy /tmp/t/usb.img $1 install $2 | tee /tmp/t/log.txt
            grep -q "hasVentoy=true version=$VENTOY_VER" /tmp/t/log.txt
            grep -q "fs=$2" /tmp/t/log.txt
            P1=$(python3 -c "import struct;d=open('/tmp/t/usb.img','rb').read(512);print(struct.unpack('<I',d[458:462])[0])")
            L=$(sudo losetup -o $((2048*512)) --sizelimit $((P1*512)) -f --show /tmp/t/usb.img)
            case $2 in
              EXFAT) sudo fsck.exfat -n $L ;;
              NTFS) sudo ntfsfix -n $L ;;
              FAT32) sudo fsck.fat -n $L ;;
              EXT4) sudo e2fsck -fn $L ;;
            esac
            sudo losetup -d $L
            java -Djava.library.path=/tmp/t/nb -cp /tmp/t/out Test app/src/main/assets/ventoy /tmp/t/usb.img $1 update | tail -1
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Compilar
        run: gradle assembleRelease --stacktrace

      - name: Preparar
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/Ventoy-no-oficial.apk
          cp NOVEDADES.txt ../dist/novedades.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Ventoy-no-oficial-apk
          path: dist/Ventoy-no-oficial.apk

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ventoy-${{ github.run_number }}
          name: "Ventoy no oficial #${{ github.run_number }} (Ventoy ${{ env.VENTOY_VER }} para Android)"
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            **Ventoy no oficial**: instala **Ventoy ${{ env.VENTOY_VER }}** en una memoria USB desde el celular, sin root, sin anuncios y sin internet.
            Descarga `Ventoy-no-oficial.apk`, conecta la USB por OTG, elige el formato de la partición (exFAT, NTFS, FAT32 o ext4) y toca «Instalar».

            Basado en [Ventoy](https://github.com/ventoy/Ventoy) de longpanda (GPLv3); usa sus archivos oficiales de arranque sin modificar. NTFS se crea con `mkntfs` de ntfs-3g (GPLv2+). No es una app oficial.
          files: |
            dist/Ventoy-no-oficial.apk
            dist/novedades.txt
