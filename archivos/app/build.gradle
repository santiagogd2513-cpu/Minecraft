plugins {
    id 'com.android.application'
}

android {
    namespace 'com.boveda.archivos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.boveda.archivos'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    signingConfigs {
        release {
            // firma fija: cada versión se instala encima de la anterior
            storeFile file('boveda.jks')
            storePassword 'boveda-archivos'
            keyAlias 'boveda'
            keyPassword 'boveda-archivos'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            // varias librerías traen los mismos archivos de información: se queda uno
            pickFirsts += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST']
            excludes += ['META-INF/versions/**', 'META-INF/*.kotlin_module', 'META-INF/proguard/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    // archivos comprimidos: zip, 7z, tar, gz, bz2, xz, lz4, lzma, Z, cpio, ar, arj
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    // zip con contraseña (AES-256)
    implementation 'net.lingala.zip4j:zip4j:2.11.5'
    // redes: WebDAV (Nextcloud, NAS…) con OkHttp, y carpetas compartidas SMB2/3 (Windows, Samba, NAS) con smbj
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.hierynomus:smbj:0.13.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    // firmador de APK (v1, v2 y v3), la misma librería del apksigner oficial de Android
    implementation 'com.android.tools.build:apksig:8.5.0'
}
