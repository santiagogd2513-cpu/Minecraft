[package]
name = "amatista-launcher"
version = "1.0.0"
description = "Amatista Launcher: launcher de Minecraft Java en español"
edition = "2021"
license = "MIT"

[lib]
name = "amatista_lib"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
futures = "0.3"
# rustls with bundled Mozilla roots: no OpenSSL, same behaviour on every OS.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
sha1_smol = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v3", "v4", "serde"] }
dirs = "6"
regex-lite = "0.1"
once_cell = "1"
md-5 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
