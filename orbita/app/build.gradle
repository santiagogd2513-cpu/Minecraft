plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forja.orbita'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forja.orbita'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    // la firma oficial se pone al final, en la compilación de GitHub (workflow arca.yml)
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
