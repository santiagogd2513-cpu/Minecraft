plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ventoy.nooficial'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ventoy.nooficial'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // los formateadores de Forja (FAT32, NTFS con mkntfs, ext4) para la partición «Ventoy»
    sourceSets {
        main {
            java {
                srcDir '../../forja/app/src/main/java'
                exclude '**/formateador/MainActivity.java', '**/formateador/UsbDisk.java', '**/formateador/Ui.java', '**/formateador/Updater.java', '**/formateador/Studio.java'
            }
        }
    }
    externalNativeBuild {
        cmake {
            path '../../forja/app/src/main/cpp/CMakeLists.txt'
        }
    }

    signingConfigs {
        release {
            // Firma fija para poder instalar cada versión nueva encima de la anterior
            storeFile file('ventoy.jks')
            storePassword 'ventoy-nooficial'
            keyAlias 'ventoy'
            keyPassword 'ventoy-nooficial'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // los archivos de Ventoy se guardan sin comprimir dentro del APK para leerlos rápido
    androidResources {
        noCompress 'img'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
