plugins {
    id 'com.android.application'
}

android {
    namespace 'com.forja.formateador'
    compileSdk 35

    defaultConfig {
        applicationId 'com.forja.formateador'
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '0')
    }

    signingConfigs {
        release {
            // Firma fija para poder instalar cada versión nueva encima de la anterior
            storeFile file('forja.jks')
            storePassword 'forja-formateador'
            keyAlias 'forja'
            keyPassword 'forja-formateador'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
